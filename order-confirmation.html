<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&display=swap" rel="stylesheet">
    <meta charset="utf-8">
    <title>Order Confirmation | ALHAH INDUSTRIES</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link rel="icon" href="img/logo1.png" type="image/x-icon">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link href="css/shop-cart.css" rel="stylesheet">
    <link href="css/colors.css" rel="stylesheet">
    <link href="css/scroll-animations.css" rel="stylesheet">
</head>

<body>
    <div class="container-fluid bg-white sticky-top shadow-sm">
        <div class="container">
            <nav class="navbar navbar-expand-lg bg-white navbar-light p-lg-0">
                <a href="index.html" class="navbar-brand">
                    <h1 class="fw-bold m-0" style="font-size:1.3rem;">ALHAH INDUSTRIES</h1>
                </a>
                <div class="ms-auto d-flex align-items-center py-2">
                    <a href="shop.html" class="btn btn-link"><i class="fas fa-arrow-left me-1"></i> Back to Shop</a>
                </div>
            </nav>
        </div>
    </div>

    <div class="container py-5" style="max-width:640px;">
        <div class="checkout-panel text-center">
            <i id="confirmIcon" class="fas fa-spinner fa-spin" style="font-size:3rem;"></i>
            <h2 id="confirmTitle" class="mt-3 mb-1">Checking order…</h2>
            <p id="confirmOrderNumber" class="text-muted mb-2" style="font-weight:700;letter-spacing:.5px;"></p>
            <p id="confirmMessage" class="text-muted mb-2">Please wait.</p>
            <p id="confirmLiveNote" style="display:none;font-size:.72rem;color:#aaa;margin-bottom:16px;">
                <i class="fas fa-sync-alt fa-spin me-1"></i>This page updates automatically if your order status changes.
            </p>
            <div id="confirmSummary" class="text-start"></div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/order-confirmation.js"></script>
    <script src="js/scroll-animations.js"></script>
</body>

</html>
