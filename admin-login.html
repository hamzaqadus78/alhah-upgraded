<!DOCTYPE html>
<html lang="en">

<head>
    <script>
    (function(){try{var scope=location.pathname.indexOf('admin')!==-1?'admin':'shop';var s=JSON.parse(localStorage.getItem('alhah_theme_'+scope)||'null');if(!s)return;var r=document.documentElement;var ov=null;try{ov=localStorage.getItem('alhah_theme_mode_override_'+scope);}catch(e){}var mode=(s.allowToggle&&(ov==='light'||ov==='dark'))?ov:(s.defaultMode==='dark'?'dark':'light');r.setAttribute('data-theme',mode);var FONTS={'dm-sans':"'DM Sans'",'inter':"'Inter'",'poppins':"'Poppins'",'montserrat':"'Montserrat'",'ibm-plex-sans':"'IBM Plex Sans'"};r.style.setProperty('--theme-font',FONTS[s.fontKey]||"'DM Sans'");var RAD={sharp:'4px',rounded:(scope==='admin'?'8px':'12px'),pill:'50px'};r.style.setProperty('--theme-btn-radius',RAD[s.buttonShape]||RAD.rounded);r.setAttribute('data-btn-fill',s.buttonFill||'solid');if(scope==='shop'){r.style.setProperty('--teal',s.accentColor);r.style.setProperty('--emerald',s.accentColor2);r.style.setProperty('--shop-teal',s.accentColor);r.style.setProperty('--shop-emerald',s.accentColor2);r.style.setProperty('--bs-primary',s.accentColor);}else{r.style.setProperty('--admin-accent',s.accentColor);}}catch(e){}})();
    </script>
    <meta charset="utf-8">
    <title>Admin Login | ALHAH INDUSTRIES</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="img/logo1.png" type="image/x-icon">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="css/admin.css" rel="stylesheet">
    <link href="css/password-toggle.css" rel="stylesheet">
</head>

<body class="admin-body">
    <div class="admin-login-wrap">
        <div class="admin-login-card">
            <div class="admin-login-icon"><i class="fas fa-shield-alt"></i></div>
            <h1>ALHAH Admin</h1>
            <p class="sub">Internal dashboard — authorized staff only.</p>

            <div class="admin-error" id="adminLoginError"></div>

            <form id="adminLoginForm">
                <div class="form-floating-group">
                    <input type="text" id="adminUsername" placeholder=" " required autocomplete="username">
                    <label for="adminUsername">Username</label>
                </div>
                <div class="form-floating-group">
                    <input type="password" id="adminPassword" placeholder=" " required autocomplete="current-password">
                    <label for="adminPassword">Password</label>
                </div>
                <button type="submit" class="admin-btn" style="width:100%;justify-content:center;" id="adminLoginBtn">
                    <i class="fas fa-lock"></i> Log In
                </button>
            </form>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/password-toggle.js"></script>
</body>

</html>
