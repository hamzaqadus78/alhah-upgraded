<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&display=swap" rel="stylesheet">
    <meta charset="utf-8">
    <title>My Account | ALHAH INDUSTRIES</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link rel="icon" href="img/logo1.png" type="image/x-icon">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="lib/animate/animate.min.css" rel="stylesheet">
    <link href="css/bootstrap.min.css" rel="stylesheet">

    <link href="css/style.css" rel="stylesheet">
    <link href="css/shop-cart.css" rel="stylesheet">
    <link href="css/colors.css" rel="stylesheet">
    <link href="css/scroll-animations.css" rel="stylesheet">
</head>

<body>
    <!-- ===================== NAVBAR ===================== -->
    <div class="container-fluid bg-white sticky-top wow fadeIn shadow-sm" data-wow-delay="0.1s">
        <div class="container">
            <nav class="navbar navbar-expand-lg bg-white navbar-light p-lg-0">
                <a href="index.html" class="navbar-brand">
                    <h1 class="fw-bold m-0" style="font-size:1.3rem;">ALHAH INDUSTRIES</h1>
                </a>
                <div class="ms-auto d-flex align-items-center gap-3 py-2">
                    <a href="shop.html" class="btn btn-link"><i class="fas fa-arrow-left me-1"></i> Back to Shop</a>
                    <button class="btn btn-link text-danger" id="logoutBtn"><i class="fas fa-sign-out-alt me-1"></i>Log Out</button>
                </div>
            </nav>
        </div>
    </div>

    <div class="container py-5">
        <div id="accountLoading" class="text-center py-5">
            <p class="text-muted">Loading your account…</p>
        </div>

        <div id="accountContent" style="display:none;">
            <div class="row g-4 mb-5">
                <div class="col-lg-4">
                    <div class="checkout-panel">
                        <h5 class="fw-bold mb-3">My Details</h5>
                        <p class="mb-2"><i class="fas fa-user text-primary me-2"></i><span id="accName"></span></p>
                        <p class="mb-2"><i class="fas fa-envelope text-primary me-2"></i><span id="accEmail"></span></p>
                        <p class="mb-0" id="accPhoneRow"><i class="fas fa-phone text-primary me-2"></i><span id="accPhone"></span></p>
                    </div>
                </div>
                <div class="col-lg-8">
                    <h2 class="section-heading mb-4" style="font-size:1.5rem;">Order History</h2>
                    <div id="ordersList"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/account.js"></script>
</body>

</html>
