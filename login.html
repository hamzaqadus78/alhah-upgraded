<!DOCTYPE html>
<html lang="en">

<head>
    <script>
    (function(){try{var scope=location.pathname.indexOf('admin')!==-1?'admin':'shop';var s=JSON.parse(localStorage.getItem('alhah_theme_'+scope)||'null');if(!s)return;var r=document.documentElement;var ov=null;try{ov=localStorage.getItem('alhah_theme_mode_override_'+scope);}catch(e){}var mode=(s.allowToggle&&(ov==='light'||ov==='dark'))?ov:(s.defaultMode==='dark'?'dark':'light');r.setAttribute('data-theme',mode);var FONTS={'dm-sans':"'DM Sans'",'inter':"'Inter'",'poppins':"'Poppins'",'montserrat':"'Montserrat'",'ibm-plex-sans':"'IBM Plex Sans'"};r.style.setProperty('--theme-font',FONTS[s.fontKey]||"'DM Sans'");var RAD={sharp:'4px',rounded:(scope==='admin'?'8px':'12px'),pill:'50px'};r.style.setProperty('--theme-btn-radius',RAD[s.buttonShape]||RAD.rounded);r.setAttribute('data-btn-fill',s.buttonFill||'solid');if(scope==='shop'){r.style.setProperty('--teal',s.accentColor);r.style.setProperty('--emerald',s.accentColor2);r.style.setProperty('--shop-teal',s.accentColor);r.style.setProperty('--shop-emerald',s.accentColor2);r.style.setProperty('--bs-primary',s.accentColor);}else{r.style.setProperty('--admin-accent',s.accentColor);}}catch(e){}})();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&display=swap" rel="stylesheet">
    <meta charset="utf-8">
    <title>Login | ALHAH INDUSTRIES</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link rel="icon" href="img/logo1.png" type="image/x-icon">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="lib/animate/animate.min.css" rel="stylesheet">
    <link href="css/bootstrap.min.css" rel="stylesheet">

    <link href="css/style.css" rel="stylesheet">
    <link href="css/shop-cart.css" rel="stylesheet">
    <link href="css/colors.css" rel="stylesheet">
    <link href="css/scroll-animations.css" rel="stylesheet">
    <link href="css/password-toggle.css" rel="stylesheet">
</head>

<body>
    <!-- ===================== NAVBAR ===================== -->
    <div class="container-fluid bg-white sticky-top wow fadeIn shadow-sm" data-wow-delay="0.1s">
        <div class="container">
            <nav class="navbar navbar-expand-lg bg-white navbar-light p-lg-0">
                <a href="index.html" class="navbar-brand">
                    <h1 class="fw-bold m-0" style="font-size:1.3rem;">ALHAH INDUSTRIES</h1>
                </a>
                <div class="ms-auto d-flex align-items-center py-2">
                    <a href="shop.html" class="btn btn-link"><i class="fas fa-arrow-left me-1"></i> Back to Shop</a>
                </div>
            </nav>
        </div>
    </div>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="auth-card">
                    <div class="auth-icon"><i class="fas fa-user-lock"></i></div>
                    <h1 class="auth-title">Welcome back</h1>
                    <p class="auth-sub">Log in to access your order history and check out faster.</p>

                    <div class="checkout-error" id="loginError"></div>
                    <p style="font-size:.9rem;"><a href="#" id="resendVerificationLink" style="display:none;">Resend the verification email</a></p>
                    <p id="resendVerificationStatus" style="display:none;font-size:.9rem;"></p>

                    <form id="loginForm">
                        <div class="form-floating-group">
                            <input type="text" id="loginUsername" placeholder=" " autocomplete="username" required>
                            <label for="loginUsername">Username</label>
                        </div>
                        <div class="form-floating-group">
                            <input type="password" id="loginPassword" placeholder=" " required>
                            <label for="loginPassword">Password</label>
                        </div>
                        <button type="submit" class="auth-submit-btn" id="loginBtn">
                            <i class="fas fa-sign-in-alt"></i>Log In
                        </button>
                    </form>

                    <p class="auth-footer-link">
                        Don't have an account? <a href="signup.html">Sign up</a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>
    <script src="js/password-toggle.js"></script>
</body>

</html>
