<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Admin Dashboard | ALHAH INDUSTRIES</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="img/logo1.png" type="image/x-icon">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="css/admin.css" rel="stylesheet">
</head>

<body class="admin-body">
    <div class="admin-topbar">
        <div class="brand">ALHAH <span>Admin</span></div>
        <div class="d-flex align-items-center" style="display:flex;align-items:center;gap:16px;">
            <span class="who" id="adminWho"></span>
            <button class="admin-btn admin-btn-ghost admin-btn-sm" id="adminLogoutBtn"><i class="fas fa-sign-out-alt"></i> Log Out</button>
        </div>
    </div>

    <div class="admin-tabs">
        <div class="admin-tab active" data-panel="products">Products</div>
        <div class="admin-tab" data-panel="orders">Orders</div>
        <div class="admin-tab" data-panel="admins">Admins</div>
    </div>

    <div class="admin-content">

        <!-- ===================== PRODUCTS ===================== -->
        <div class="admin-panel active" id="panel-products">
            <div class="admin-section-head">
                <h2>Products</h2>
                <button class="admin-btn" id="newProductBtn"><i class="fas fa-plus"></i> Add Product</button>
            </div>
            <div class="admin-table-wrap">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Name</th><th>SKU</th><th>Category</th><th>Price</th><th>Stock</th><th>MOQ</th><th>Status</th><th></th>
                        </tr>
                    </thead>
                    <tbody id="productsTableBody"></tbody>
                </table>
            </div>
        </div>

        <!-- ===================== ORDERS ===================== -->
        <div class="admin-panel" id="panel-orders">
            <div class="admin-section-head">
                <h2>Orders</h2>
            </div>
            <div class="admin-table-wrap">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Date</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="ordersTableBody"></tbody>
                </table>
            </div>
        </div>

        <!-- ===================== ADMINS ===================== -->
        <div class="admin-panel" id="panel-admins">
            <div class="admin-section-head">
                <h2>Admin Accounts</h2>
                <button class="admin-btn" id="newAdminBtn"><i class="fas fa-plus"></i> Add Admin</button>
            </div>
            <div class="admin-table-wrap">
                <table class="admin-table">
                    <thead>
                        <tr><th>Name</th><th>Email</th><th>Created</th></tr>
                    </thead>
                    <tbody id="adminsTableBody"></tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- ===================== PRODUCT MODAL ===================== -->
    <div class="admin-modal-overlay" id="productModalOverlay">
        <div class="admin-modal">
            <h3 id="productModalTitle">Add Product</h3>
            <div class="admin-error" id="productModalError"></div>
            <form id="productForm">
                <input type="hidden" id="pfId">
                <div class="admin-field"><label>Name</label><input type="text" id="pfName" required></div>
                <div class="admin-field"><label>SKU</label><input type="text" id="pfSku" required></div>
                <div class="admin-field"><label>Category</label><input type="text" id="pfCategory" required value="Dental Surgery"></div>
                <div class="admin-field"><label>Description</label><textarea id="pfDescription" rows="3" required></textarea></div>
                <div style="display:flex;gap:12px;">
                    <div class="admin-field" style="flex:1;"><label>Price (USD)</label><input type="number" id="pfPrice" step="0.01" min="0" required></div>
                    <div class="admin-field" style="flex:1;"><label>Stock</label><input type="number" id="pfStock" min="0" required></div>
                    <div class="admin-field" style="flex:1;"><label>MOQ</label><input type="number" id="pfMoq" min="1" required></div>
                </div>
                <div class="admin-field"><label>Image path <span style="font-weight:400;">(e.g. img/Dental3.jpg)</span></label><input type="text" id="pfImage"></div>
                <div class="admin-field">
                    <label style="display:flex;align-items:center;gap:8px;font-weight:400;">
                        <input type="checkbox" id="pfActive" style="width:auto;" checked> Active (visible in shop)
                    </label>
                </div>
                <div class="admin-modal-actions">
                    <button type="button" class="admin-btn admin-btn-ghost" id="productModalCancel">Cancel</button>
                    <button type="submit" class="admin-btn" id="productModalSave">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ===================== ADMIN MODAL ===================== -->
    <div class="admin-modal-overlay" id="adminModalOverlay">
        <div class="admin-modal">
            <h3>Add Admin</h3>
            <div class="admin-error" id="adminModalError"></div>
            <form id="adminForm">
                <div class="admin-field"><label>Name</label><input type="text" id="afName" required></div>
                <div class="admin-field"><label>Email</label><input type="email" id="afEmail" required></div>
                <div class="admin-field"><label>Password</label><input type="password" id="afPassword" minlength="8" required><small>At least 8 characters.</small></div>
                <div class="admin-modal-actions">
                    <button type="button" class="admin-btn admin-btn-ghost" id="adminModalCancel">Cancel</button>
                    <button type="submit" class="admin-btn" id="adminModalSave">Create</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/admin.js"></script>
</body>

</html>
